services:
  postgres:
    image: postgres:17
    container_name: azure-quiz-backend-postgres
    environment:
      POSTGRES_DB: quizz
      POSTGRES_USER: quizz
      POSTGRES_PASSWORD: quizz
    ports:
      - "5432:5432"
    volumes:
      - quizz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizz -d quizz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quizz-db-data:
