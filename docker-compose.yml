services:
  postgres:
    image: postgres:17
    container_name: azure-quiz-backend-postgres
    environment:
      POSTGRES_DB: quizz
      POSTGRES_USER: quizz
      POSTGRES_PASSWORD: quizz
    ports:
      - "5432:5432"
    volumes:
      - quizz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizz -d quizz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: azure-quiz-backend-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azure-quiz-backend-azurite
    # --skipApiVersionCheck: Azurite ships a fixed set of supported Storage REST API versions and
    # rejects requests from newer SDK clients with "API version ... is not supported by Azurite"
    # otherwise (hit while wiring this up, with the Azure SDK for Java's default x-ms-version).
    # Fine for local dev/testing; Microsoft's own documented workaround.
    # --location: without this, Azurite stores blobs in its container's default (ephemeral)
    # working directory, so every `docker compose down` silently wipes all uploaded question
    # images while quizz-db-data (Postgres) survives — the DB keeps referencing blob names that
    # no longer exist. Mounting a named volume here mirrors Postgres and keeps both in sync.
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --location /data"
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  quizz-db-data:
  azurite-data:
