apiVersion: v1
kind: Service
metadata:
  name: {{ include "quiz-backend.fullname" . }}
  labels:
    {{- include "quiz-backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
