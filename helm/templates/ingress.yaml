{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quiz-backend.fullname" . }}
  labels:
    {{- include "quiz-backend.labels" . | nindent 4 }}
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    # Real Let's Encrypt cert instead of the App Routing add-on's self-signed
    # default -- cert-manager (setup-cert-manager.sh/.yml, trainer-run
    # one-shot on the shared cluster) watches for this annotation and issues
    # into spec.tls[].secretName below. Set ingress.clusterIssuer to "" to
    # fall back to the old self-signed behavior (e.g. cert-manager not
    # installed yet on this cluster).
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.clusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "quiz-backend.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "quiz-backend.fullname" . }}
                port:
                  # The Service's own port (service.yaml hardcodes 80), not
                  # .Values.service.port -- that one's the container's port
                  # (8080), used as the Service's targetPort instead.
                  number: 80
{{- end }}
