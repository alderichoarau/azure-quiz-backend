apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quiz-backend.fullname" . }}
  labels:
    {{- include "quiz-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        # Makes the /tmp emptyDir below writable by GID 1001, matching the
        # container's runAsUser/runAsGroup -- needed because
        # readOnlyRootFilesystem (below) pushes the JVM/embedded Tomcat's only
        # writable path (multipart upload buffering under java.io.tmpdir,
        # default /tmp) out into a volume instead of the image's own
        # (otherwise read-only) root fs. No other local disk write exists in
        # this app: uploads go straight to Azure Blob Storage, exports too
        # (QuizResultExportService), nothing under src/main/java touches the
        # filesystem directly.
        fsGroup: 1001
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # Non-secret config (SPRING_PROFILES_ACTIVE, plus whatever CI adds
          # via --set-string env.*, e.g. SPRING_DATASOURCE_URL, REDIS_HOSTNAME).
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Secret config (DB password, Redis password, API key, ...) — the
          # Secret named here is created by aks-deploy.yml BEFORE this chart
          # is installed/upgraded, not by this chart (see values.yaml comment
          # on secretName).
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
