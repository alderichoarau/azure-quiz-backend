# -----------------------------------------------------------------------------------------------
# Container & IaC: the Dockerfile + Helm chart (AKS track) are worth scanning on two axes:
#   - iac-misconfig -- Trivy's misconfig scanner over Dockerfile/helm/ (root by default, missing
#     resource limits, ...)
#   - image-scan    -- builds the image like aks-deploy.yml does, scans it (OS + jar deps) for CVEs.
# -----------------------------------------------------------------------------------------------
name: "Security (Container & IaC): Trivy Scan"
run-name: Security (Container & IaC) - Run Trivy Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iac-misconfig:
    name: "Trivy (Dockerfile / Helm misconfig)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Scan IaC for misconfigurations (trivy)"
        uses: alderichoarau/gha-trivy-scan@v1
        with:
          scan-type: fs
          scanners: misconfig
          heading: "Dockerfile / Helm Misconfigurations"

  image-scan:
    name: "Trivy (built image CVEs)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Build image"
        run: docker build -t quiz-backend:ci-scan .

      - name: "Scan image for known CVEs (trivy)"
        uses: alderichoarau/gha-trivy-scan@v1
        with:
          scan-type: image
          image-ref: quiz-backend:ci-scan
          scanners: vuln
          heading: "Built Image CVEs"
