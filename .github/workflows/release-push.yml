# -----------------------------------------------------------------------------------------------
# Fires when a release-prepare.yml PR (branch release/<tag>) merges into main: tags the release,
# creates the GitHub release, then deploys to PROD -- the release process is this repo's prod
# deployment gate. Nonprod isn't touched here: it's deployed directly and manually via
# aks-deploy.yml/asp-deploy.yml (environment=nonprod), without going through a release. Same
# pattern as azure-quiz-frontend's release-push.yml.
#
# Also runnable manually (workflow_dispatch) to redeploy an already-tagged release (e.g. retry a
# failed prod run) -- skips tagging/release creation, which only ever happens once.
# -----------------------------------------------------------------------------------------------
name: "Release - Publish"
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Release - Deploy {0} to {1}', inputs.tag, inputs.environment) || ((github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')) && format('Release - Publish from #{0}', github.event.pull_request.number) || format('Release - Skip: PR #{0} not a release merge', github.event.pull_request.number)) }}"

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to deploy (e.g. v1.8.0) -- skips tagging/release creation"
        required: true
        type: string
      environment:
        description: "Which GitHub Environment to deploy this tag to"
        required: true
        type: environment
        default: nonprod

permissions:
  contents: write
  actions: write

jobs:
  push:
    name: "Tag, release, and deploy"
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.pull_request.base.ref }}

      - name: "Resolve tag name and target environment"
        id: tag
        # inputs.tag / head.ref are chosen by whoever triggers the workflow or names the branch, so
        # they go through env vars (never interpolated into the script text -- that would be script
        # injection) and are format-checked before being written to $GITHUB_OUTPUT (a value with a
        # newline could otherwise forge extra outputs).
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            environment="$INPUT_ENVIRONMENT"
          else
            tag="${HEAD_REF#release/}"
            environment="prod"
          fi
          if ! [[ "$tag" =~ ^[A-Za-z0-9._-]+$ && "$environment" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid tag or environment name, refusing to continue."
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: "Create and push tag"
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: "Create GitHub release"
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes

      - name: "Trigger AKS + App Service deploys"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          TARGET_ENV: ${{ steps.tag.outputs.environment }}
        run: |
          # Releases created with GITHUB_TOKEN don't emit events that trigger other workflows, so
          # both deploy workflows are dispatched explicitly here, pinned to this tag. This only
          # fires the dispatch and returns -- the actual gate is the target GitHub Environment's
          # required-reviewer rule (repo Settings > Environments), which both aks-deploy.yml and
          # asp-deploy.yml's deploy jobs target (`environment: ${{ inputs.environment }}`): each
          # run pauses there for manual approval before anything actually deploys.
          gh workflow run aks-deploy.yml --ref "$TAG" -f environment="$TARGET_ENV"
          gh workflow run asp-deploy.yml --ref "$TAG" -f environment="$TARGET_ENV"

      - name: "Job summary"
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.name }}
          TARGET_ENV: ${{ steps.tag.outputs.environment }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Release pushed — $TAG"
            echo "- **Tag** : $TAG"
            echo "- **Deploy triggered for** : $TARGET_ENV (AKS + App Service) — awaiting manual approval on that environment before either actually runs"
            echo "- **Actor** : @$ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"
