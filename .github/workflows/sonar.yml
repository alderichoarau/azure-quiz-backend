# -----------------------------------------------------------------------------------------------
# GitHub Action to run SonarCloud analysis on the codebase.
# Automated and required for pull requests (PRs).
# -----------------------------------------------------------------------------------------------
name: GitHub - Sonar Cloud Analysis
run-name: Sonar Cloud Analysis - ${{ github.ref_name}}


on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECT_KEY: alderichoarau_azure-quiz-backend
  SONAR_ORGANIZATION: alderichoarau
  SONAR_HOST_URL: https://sonarcloud.io

jobs:
  sonar-scan:
    name: Sonar scan
    runs-on: ubuntu-latest
    steps:
      # Documentation: https://github.com/actions/checkout
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Documentation: https://github.com/actions/setup-java
      - name: "Setup Java"
        id: setup-java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Sonar packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        # sonar.coverage.jacoco.xmlReportPaths set explicitly rather than
        # relying on the Sonar Java plugin's own default guess -- the
        # jacoco-maven-plugin (pom.xml) writes here via its `report`
        # execution, bound to the `test` phase, which finishes before this
        # single `mvn verify sonar:sonar` invocation reaches the sonar goal.
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

